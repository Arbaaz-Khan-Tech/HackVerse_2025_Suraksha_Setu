{% extends "police_base.html" %}

{% block title %}Crime Locator - Police Dashboard{% endblock %}

{% block extra_head %}
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.7.1/dist/leaflet.css" />
<style>
    #map {
        height: calc(100vh - 16rem);
        min-height: 500px;
        border-radius: 8px;
    }
</style>
{% endblock %}

{% block content %}
<h2 class="text-2xl font-bold mb-4 dark:text-white">Crime Locator</h2>

<div class="bg-white dark:bg-gray-800 rounded-lg shadow-md p-4 mb-4">
    <div class="flex flex-wrap gap-4">
        <select id="timeRange" class="bg-gray-100 dark:bg-gray-700 text-gray-800 dark:text-white rounded-md px-3 py-2">
            <option value="24h">Last 24 Hours</option>
            <option value="7d">Last 7 Days</option>
            <option value="30d">Last 30 Days</option>
        </select>
        <select id="crimeType" class="bg-gray-100 dark:bg-gray-700 text-gray-800 dark:text-white rounded-md px-3 py-2">
            <option value="all">All Crimes</option>
            <option value="theft">Theft</option>
            <option value="assault">Assault</option>
            <option value="burglary">Burglary</option>
        </select>
    </div>
</div>

<div id="map" class="w-full rounded-lg shadow-md"></div>
{% endblock %}

{% block extra_scripts %}
<script src="https://unpkg.com/leaflet@1.7.1/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/leaflet.heat@0.2.0/dist/leaflet-heat.js"></script>
<script>
document.addEventListener('DOMContentLoaded', function () {
    const map = L.map('map').setView([19.0628161, 72.8888403], 13);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '© OpenStreetMap contributors'
    }).addTo(map);

    async function sendMarkerToBackend(lat, lng) {
        try {
            const response = await fetch('/api/markers', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ lat, lng })
            });
            await response.json();
        } catch (error) {
            console.error('Error saving marker:', error);
        }
    }

    map.on('click', (e) => {
        const { lat, lng } = e.latlng;
        L.marker([lat, lng]).addTo(map);
        sendMarkerToBackend(lat, lng);
    });

    async function loadMarkers() {
        try {
            const response = await fetch('/api/markers');
            const markers = await response.json();
            markers.forEach(({ lat, lng }) => L.marker([lat, lng]).addTo(map));
        } catch (error) {
            console.error('Error loading markers:', error);
        }
    }
    loadMarkers();

    setTimeout(() => map.invalidateSize(), 100);
});
</script>
{% endblock %}
